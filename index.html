<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LearnPath</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#7F77DD;--pl:#EEEDFE;--pd:#3C3489;
  --t:#1D9E75;--tl:#E1F5EE;--td:#085041;
  --a:#BA7517;--al:#FAEEDA;
  --c:#D85A30;--cl:#FAECE7;
  --gl:#F1EFE8;--gb:#D3D1C7;
  --tx:#2C2C2A;--tm:#5F5E5A;--th:#888780;
  --bg:#F7F6F2;--r:12px;--rs:8px;--sh:0 1px 8px rgba(0,0,0,.07)
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--pl),var(--tl))}
.auth-card{background:#fff;border-radius:24px;padding:44px 36px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.alogo{width:56px;height:56px;background:var(--p);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.alogo svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.auth-card h1{font-size:24px;font-weight:700;margin-bottom:5px}
.auth-card>p{color:var(--tm);font-size:14px;margin-bottom:24px;line-height:1.5}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:12px 20px;border:1.5px solid var(--gb);border-radius:var(--r);background:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.gbtn:hover{border-color:var(--p);background:var(--pl)}
.gbtn img{width:20px}
#role{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.ri{max-width:440px;width:100%;text-align:center}
.ri h2{font-size:21px;font-weight:700;margin-bottom:5px}
.ri>p{color:var(--tm);margin-bottom:24px;font-size:14px}
.role-cards{display:flex;flex-direction:column;gap:11px}
.role-card{padding:16px;border-radius:var(--r);border:1.5px solid var(--gb);background:#fff;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:14px}
.role-card:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:var(--sh)}
.role-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.role-card h3{font-size:15px;font-weight:700;margin-bottom:2px}
.role-card p{font-size:12px;color:var(--tm);margin:0}
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--gb);padding:0 14px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tbl{display:flex;align-items:center;gap:9px}
.tlogo{width:30px;height:30px;background:var(--p);border-radius:8px;display:flex;align-items:center;justify-content:center}
.tlogo svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tname{font-size:15px;font-weight:700}
.uinfo{display:flex;align-items:center;gap:7px}
.uav{width:28px;height:28px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid var(--gb)}
.uname{font-size:12px;font-weight:600}
.coin-pill{display:flex;align-items:center;gap:4px;background:var(--al);border-radius:20px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--a);cursor:pointer;border:none}
.nbtn{position:relative;background:none;border:none;cursor:pointer;padding:3px}
.nbtn svg{width:19px;height:19px;stroke:var(--tm);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.ndot{display:none;position:absolute;top:-1px;right:-1px;background:var(--c);color:#fff;font-size:8px;font-weight:700;width:14px;height:14px;border-radius:50%;align-items:center;justify-content:center;line-height:14px;text-align:center}
.sob{font-size:11px;color:var(--tm);cursor:pointer;border:1px solid var(--gb);padding:3px 7px;border-radius:6px;background:none}
.mc{flex:1;overflow-y:auto;padding:14px;max-width:640px;margin:0 auto;width:100%;padding-bottom:70px}
.bnav{background:#fff;border-top:1px solid var(--gb);display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 3px;cursor:pointer;gap:2px;border:none;background:none;color:var(--tm);font-size:10px;font-weight:500;transition:color .15s}
.ni.active{color:var(--p)}
.ni svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--gb)}
.pt{font-size:19px;font-weight:700;margin-bottom:2px}
.ps{font-size:13px;color:var(--tm);margin-bottom:14px}
.btn{padding:9px 18px;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .18s;display:inline-block}
.btp{background:var(--p);color:#fff}
.bts{background:var(--gl);color:var(--tx)}
.btg{background:var(--t);color:#fff}
.bto{background:none;border:1.5px solid var(--gb);color:var(--tm)}
.btf{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.fg{margin-bottom:11px}
.fl{font-size:12px;font-weight:600;color:var(--tm);margin-bottom:4px;display:block}
.fi,.fse,.fta{width:100%;padding:9px 11px;border:1.5px solid var(--gb);border-radius:var(--rs);font-size:13px;color:var(--tx);background:#fff;font-family:inherit;transition:border-color .2s}
.fi:focus,.fse:focus,.fta:focus{outline:none;border-color:var(--p)}
.fta{min-height:64px;resize:vertical}
.tip{background:var(--al);border-left:3px solid var(--a);padding:8px 11px;border-radius:0 var(--rs) var(--rs) 0;font-size:12px;color:var(--a);margin-top:5px;line-height:1.5}
.chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--gb);font-size:12px;font-weight:600;cursor:pointer;background:#fff;transition:all .15s;display:inline-block;margin:3px}
.chip.sel{border-color:var(--p);background:var(--pl);color:var(--pd)}
.divider{height:1px;background:var(--gb);margin:13px 0}
.sb{display:inline-flex;align-items:center;gap:2px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.sp{background:var(--al);color:var(--a)}
.sa{background:var(--tl);color:var(--td)}
.sr{background:var(--cl);color:var(--c)}
.fb{display:flex;align-items:center;justify-content:space-between}
.agenda-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}
.agenda-block{background:#fff;border-radius:var(--r);padding:13px;border:1.5px solid var(--gb);cursor:pointer;transition:all .18s;min-height:90px;display:flex;flex-direction:column;justify-content:space-between}
.agenda-block:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:var(--sh)}
.ab-icon{font-size:22px;margin-bottom:6px}
.ab-title{font-size:12px;font-weight:700;line-height:1.3}
.ab-sub{font-size:11px;color:var(--tm);margin-top:3px}
.post{background:#fff;border-radius:var(--r);margin-bottom:10px;border:1px solid var(--gb);overflow:hidden}
.post-hdr{display:flex;align-items:center;gap:9px;padding:11px 13px 0}
.post-av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;cursor:pointer}
.post-avp{width:36px;height:36px;border-radius:50%;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--p);flex-shrink:0;cursor:pointer}
.post-name{font-size:13px;font-weight:700;cursor:pointer}
.post-meta{font-size:11px;color:var(--tm)}
.post-body{padding:9px 13px}
.post-text{font-size:13px;line-height:1.6;margin-bottom:7px}
.post-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.post-tag{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.post-draft{background:var(--al);color:var(--a);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:8px}
.post-actions{display:flex;border-top:1px solid var(--gb)}
.post-act{flex:1;padding:9px 0;font-size:12px;font-weight:600;color:var(--tm);background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.post-act:hover{background:var(--gl);color:var(--p)}
.comments-section{padding:0 13px 10px;border-top:1px solid var(--gb)}
.comment{padding:9px 0;border-bottom:1px solid var(--gl)}
.comment:last-child{border-bottom:none}
.comment-name{font-size:12px;font-weight:700;color:var(--pd);margin-bottom:3px}
.comment-text{font-size:12px;color:var(--tm);line-height:1.5}
.qprog{height:3px;background:var(--gb);border-radius:2px;margin-bottom:18px;overflow:hidden}
.qpf{height:100%;background:var(--p);border-radius:2px;transition:width .4s}
.ql{font-size:11px;color:var(--th);margin-bottom:3px}
.qq{font-size:17px;font-weight:600;margin-bottom:4px;line-height:1.4}
.qs2{font-size:13px;color:var(--tm);margin-bottom:14px}
.qopts{display:flex;flex-direction:column;gap:7px}
.qo{padding:11px 13px;border-radius:var(--r);border:1px solid var(--gb);background:#fff;cursor:pointer;text-align:left;font-size:13px;transition:all .15s;display:flex;align-items:flex-start;gap:10px}
.qo:hover{border-color:var(--p);background:var(--pl)}
.qo.sel{border-color:var(--p);background:var(--pl);color:var(--pd)}
.qo.skip-opt{border-style:dashed;color:var(--th)}
.qo.skip-opt.sel{border-color:var(--c);background:var(--cl);color:var(--c);border-style:solid}
.qchk{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--gb);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.qo.sel .qchk{border-color:var(--p);background:var(--p);color:#fff;font-size:9px}
.qnav{display:flex;justify-content:space-between;margin-top:16px}
.prod-top{border:1.5px solid var(--p);background:var(--pl);border-radius:var(--r);padding:13px;margin-bottom:8px}
.prod-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--gb);border-radius:var(--rs);background:#fff;margin-bottom:6px;cursor:pointer;transition:all .15s}
.prod-row:hover{border-color:var(--p)}
.prod-row.chosen{border-color:var(--t);background:var(--tl)}
.week-block{border:1.5px solid var(--gb);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.week-header{padding:11px 13px;background:var(--gl);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.week-title{font-size:13px;font-weight:700}
.week-status{font-size:11px;color:var(--tm)}
.week-body{padding:13px;border-top:1px solid var(--gb);background:#fff;display:none}
.week-body.open{display:block}
.step-item{padding:11px 13px;border-radius:var(--rs);border:1.5px solid var(--gb);background:#fff;margin-bottom:7px;cursor:pointer;transition:all .15s}
.step-item.done{background:var(--tl);border-color:var(--t)}
.step-row{display:flex;align-items:center;gap:10px}
.step-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--gb);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;transition:all .15s}
.step-chk.done{background:var(--t);border-color:var(--t);color:#fff}
.step-txt{font-size:13px;font-weight:500;flex:1}
.step-txt.done{text-decoration:line-through;color:var(--tm)}
.rubrow{margin-bottom:11px;padding:11px;border-radius:var(--rs);border:1.5px solid var(--gb);background:#fff}
.rubcrit{font-size:12px;font-weight:700;margin-bottom:2px}
.rubcdesc{font-size:11px;color:var(--tm);margin-bottom:7px}
.rubscale{display:flex;gap:5px}
.rubbtn{flex:1;padding:7px 0;border-radius:var(--rs);border:1.5px solid var(--gb);font-size:13px;font-weight:700;cursor:pointer;background:#fff;transition:all .15s}
.rubbtn:hover{border-color:var(--p);background:var(--pl)}
.rubbtn.sel{border-color:var(--p);background:var(--p);color:#fff}
.rubanchor{display:flex;justify-content:space-between;font-size:10px;color:var(--th);margin-top:2px}
.rublvl{font-size:11px;color:var(--tm);margin-top:5px;padding:6px 9px;background:var(--gl);border-radius:6px;line-height:1.5}
.chat-wrap{display:flex;flex-direction:column;height:320px;border-radius:var(--r);border:1.5px solid var(--gb);overflow:hidden;background:#fff}
.chat-msgs{flex:1;overflow-y:auto;padding:11px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:85%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.5}
.msg.ai{background:var(--pl);color:var(--pd);align-self:flex-start;border-bottom-left-radius:3px}
.msg.me{background:var(--p);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.chat-in{display:flex;gap:7px;padding:8px;border-top:1px solid var(--gb)}
.chat-in input{flex:1;padding:8px 10px;border:1.5px solid var(--gb);border-radius:var(--rs);font-size:13px;font-family:inherit}
.chat-in input:focus{outline:none;border-color:var(--p)}
.forum-bbl{padding:9px 11px;border-radius:12px;margin-bottom:7px;font-size:13px;line-height:1.5;max-width:85%}
.forum-bbl.mine{background:var(--p);color:#fff;margin-left:auto;border-bottom-right-radius:3px}
.forum-bbl.theirs{background:#fff;border:1.5px solid var(--gb);border-bottom-left-radius:3px}
.prof-av-wrap{position:relative;width:70px;height:70px;margin:0 auto 10px;cursor:pointer}
.prof-av-img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid var(--p);display:block}
.prof-av-plc{width:70px;height:70px;border-radius:50%;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--p);border:3px solid var(--p)}
.prof-av-edit{position:absolute;bottom:0;right:0;width:22px;height:22px;background:var(--p);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.sticker-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.sticker{aspect-ratio:1;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:24px;border:1.5px solid var(--gb);background:#fff}
.sticker.earned{border-color:var(--a);background:var(--al)}
.sticker.locked{opacity:.35}
.pbw{background:var(--gb);border-radius:5px;height:7px;margin:5px 0 11px;overflow:hidden}
.pbf{height:100%;border-radius:5px;background:var(--t);transition:width .5s}
.obtn{padding:4px 10px;border-radius:20px;border:1.5px solid var(--gb);font-size:11px;font-weight:600;cursor:pointer;background:none;color:var(--tm);text-decoration:none;transition:all .15s;display:inline-block}
.obtn:hover{border-color:var(--t);color:var(--t)}
.empty{text-align:center;padding:28px 14px;color:var(--tm)}
.ei{font-size:30px;margin-bottom:7px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#2C2C2A;color:#fff;padding:9px 18px;border-radius:var(--rs);font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.loading{text-align:center;padding:32px;color:var(--tm);font-size:13px}
.mt8{margin-top:8px}.mb8{margin-bottom:8px}.mt12{margin-top:12px}
.toggle-row{display:flex;border-radius:var(--rs);overflow:hidden;border:1.5px solid var(--gb);margin-bottom:12px}
.toggle-btn{flex:1;padding:8px 0;font-size:12px;font-weight:600;cursor:pointer;border:none;background:#fff;color:var(--tm);transition:all .15s;text-align:center}
.toggle-btn.act{background:var(--p);color:#fff}
.step-card{background:#fff;border-radius:var(--r);border:1.5px solid var(--gb);padding:15px;margin-bottom:11px;cursor:pointer;transition:all .18s;display:flex;gap:12px;align-items:flex-start}
.step-card:hover{border-color:var(--p);box-shadow:var(--sh)}
.step-card.locked{opacity:.55;cursor:not-allowed}
.step-card.locked:hover{border-color:var(--gb);box-shadow:none}
.step-num{width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-card.locked .step-num{background:var(--gb);color:var(--tm)}
.step-title{font-size:14px;font-weight:700;margin-bottom:2px}
.step-sub{font-size:12px;color:var(--tm);line-height:1.4}
.lockbar{position:sticky;top:0;background:var(--pd);color:#fff;padding:10px 13px;border-radius:var(--r);margin-bottom:14px;text-align:center;z-index:5}
.lockbar .lt{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.lockbar .lb{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.lockbar.urgent{background:var(--c)}
.word-chip{display:inline-block;padding:4px 11px;border-radius:20px;background:var(--pl);color:var(--pd);font-size:12px;font-weight:600;margin:3px}
.sugg-task{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border:1.5px dashed var(--p);border-radius:20px;font-size:12px;color:var(--pd);cursor:pointer;margin:3px;background:var(--pl)}
.sugg-res{display:inline-block;padding:4px 10px;border-radius:20px;background:var(--al);color:var(--a);font-size:11px;font-weight:600;margin:3px}
.contract-cols{display:flex;flex-wrap:wrap;gap:12px}
.contract-col{flex:1 1 220px;min-width:200px;background:var(--gl);border-radius:var(--r);padding:12px}
.cc-title{font-size:12px;font-weight:700;color:var(--pd);margin-bottom:9px;text-transform:uppercase;letter-spacing:.4px}
.goal-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;font-size:12px;line-height:1.5;cursor:pointer;border-bottom:1px solid var(--gb)}
.goal-row:last-child{border-bottom:none}
.goal-row.sel{color:var(--td);font-weight:600}
.goal-row .qchk{margin-top:1px}
.rubarea{margin-bottom:16px}
.rubarea-name{font-size:13px;font-weight:700}
.rubarea-q{font-size:11px;color:var(--tm);margin-bottom:7px}
.rublevel-opt{border:1.5px solid var(--gb);border-radius:var(--rs);padding:9px 11px;margin-bottom:6px;cursor:pointer;font-size:12px;transition:all .15s}
.rublevel-opt:hover{border-color:var(--p)}
.rublevel-opt.sel{border-color:var(--p);background:var(--pl);color:var(--pd);font-weight:600}
.rublevel-bullets{margin-top:6px;font-size:11px;font-weight:400;color:var(--tm);line-height:1.6}
.project-card{background:#fff;border-radius:var(--r);border:1px solid var(--gb);padding:12px;margin-bottom:8px}
.rubarea2{background:#fff;border:1px solid var(--gb);border-radius:var(--r);padding:13px;margin-bottom:10px}
.rubarea2-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.rub-details-btn{flex-shrink:0;padding:7px 13px;border-radius:20px;border:1.5px solid var(--tx);background:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.rub-pills{display:flex;flex-wrap:wrap;gap:7px}
.rub-pill{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid transparent}
.rub-pill.tier0{background:#EAF1FE;color:#2F6FED}
.rub-pill.tier1{background:var(--tl);color:var(--td)}
.rub-pill.tier2{background:var(--al);color:var(--a)}
.rub-pill.sel{border-color:currentColor;box-shadow:0 0 0 1.5px currentColor inset}
.rub-details-panel{margin-top:11px;display:flex;flex-direction:column;gap:10px}
.rub-detail-item{background:var(--gl);border-radius:var(--rs);padding:10px 11px;cursor:pointer;border:1.5px solid transparent}
.rub-detail-item.sel{border-color:var(--p);background:var(--pl)}
.rub-detail-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:2px}
</style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <div class="alogo"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5M2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <h1>LearnPath</h1>
    <p>Your English learning space. Sign in with your school Google account.</p>
    <button class="gbtn" id="gsign"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G"> Continue with Google</button>
  </div>
</div>

<div id="role">

async function ensureCatalogSeeded(){

    var snap=await get(ref(db,"ideaCatalog"));
    if(snap.exists())return;
    var seed={};
    ["written","spoken","visual"].forEach(function(cat){
      seed[cat]={};
      DEFAULT_CATALOG[cat].forEach(function(pair){seed[cat][pair[0]]={name:pair[1],active:true};});
    });

  }catch(e){
    console.error("ensureCatalogSeeded failed:",e);
  }
}
async function loadCatalog(){
  try{
    var snap=await get(ref(db,"ideaCatalog"));
    var raw=snap.exists()?snap.val():{};
    var out={written:[],spoken:[],visual:[]};
    ["written","spoken","visual"].forEach(function(cat){
      var items=raw[cat]||{};
      Object.keys(items).forEach(function(id){out[cat].push({id:id,name:items[id].name,active:items[id].active!==false});});
    });
    // if nothing came back from the DB (e.g. permission issue), fall back to built-in defaults so the quiz still works
    if(!out.written.length&&!out.spoken.length&&!out.visual.length){
      ["written","spoken","visual"].forEach(function(cat){
        out[cat]=DEFAULT_CATALOG[cat].map(function(pair){return {id:pair[0],name:pair[1],active:true};});
      });
    }
    return out;
  }catch(e){
    console.error("loadCatalog failed, using built-in defaults:",e);
    var out2={written:[],spoken:[],visual:[]};
    ["written","spoken","visual"].forEach(function(cat){
      out2[cat]=DEFAULT_CATALOG[cat].map(function(pair){return {id:pair[0],name:pair[1],active:true};});
    });
    return out2;
  }
}

function isLockedStep(step){var ls=window._liveSession;return !!(ls&&ls.active&&ls.step===step);}
function lockBarHTML(){
  var ls=window._liveSession;
  var timed=ls.step==="step2"||ls.step==="step3";
  var urgent=timed&&ls.deadline&&(ls.deadline-Date.now())<=0;
  return '<div class="lockbar'+(urgent?" urgent":"")+'" id="lockbar"><div class="lt">&#128104;&#8205;&#127979; Your teacher is guiding this part</div>'
    +(timed?'<div class="lb" id="lockbar-timer">--:--</div>':'<div class="lb">&#128214; What We\'re Learning</div>')+'</div>';
}
function startLockTimerInterval(){
  if(window._lockInterval)return;
  window._lockInterval=setInterval(updateLockTimerDisplay,1000);
  updateLockTimerDisplay();
}
function stopLockTimerInterval(){
  if(window._lockInterval){clearInterval(window._lockInterval);window._lockInterval=null;}
}
function updateLockTimerDisplay(){
  var ls=window._liveSession;
  var el=document.getElementById("lockbar-timer");
  if(!ls||!ls.active||(ls.step!=="step2"&&ls.step!=="step3")||!ls.deadline){return;}
  var rem=Math.max(0,Math.round((ls.deadline-Date.now())/1000));
  var mm=Math.floor(rem/60),ss=rem%60;
  var txt=(rem<=0?"Time's up!":mm+":"+(ss<10?"0":"")+ss);
  if(el)el.textContent=txt;
  var bar=document.getElementById("lockbar");
  if(bar)bar.classList.toggle("urgent",rem<=0);
}
function applySessionLock(){
  if(!CU||UP&&UP.role==="teacher")return;
  var bnav=document.getElementById("bnav");
  var ls=window._liveSession||{active:false};
  if(ls.active){
    if(bnav)bnav.style.display="none";
    if(ls.step==="step1"){renderStep1Screen();}
    else if(ls.step==="step2"){
      if(!window._quizStarted){startQuiz();window._quizStarted=true;}
      else{renderQuizStep();}
    }
    else if(ls.step==="step3"){renderStep3Screen();}
    startLockTimerInterval();
  } else {
    if(bnav)bnav.style.display="flex";
    stopLockTimerInterval();
    window._quizStarted=false;
    go("home");
  }
}

function loadProjectsList(){

    if(!list.length){el.innerHTML='<div class="empty"><div class="ei">&#128203;</div><p>No projects chosen yet.</p></div>';return;}
    list.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    var html="";

      var statusLabel=d.status==="approved"?"Approved":d.status==="pending"?"Pending approval":d.status==="awaiting_grouping"?"Awaiting grouping":"Draft";

      html+='<div style="font-size:12px;color:var(--tm)">'+esc(d.productType)+'</div></div>';
      html+='<span class="sb '+statusClass+'" style="'+(statusClass?"":"background:var(--gl);color:var(--tm)")+'">'+statusLabel+'</span>';
      html+='</div>';

        html+='<div class="divider" style="margin:9px 0"></div>';
        html+='<div style="font-size:13px;margin-bottom:8px">I will create a <strong>'+esc(d.productType)+'</strong> about <strong>'+(d.topic?esc(d.topic):"—")+'</strong>.</div>';

        });
        if(d.evalTeacherPct||d.evalPeerPct){
          html+='<div style="font-size:11px;font-weight:700;color:var(--th);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 4px">Evaluation Goals</div>';
          html+='<div style="font-size:12px">Teacher: '+esc(d.evalTeacherPct||"—")+"% &bull; Classmates: "+esc(d.evalPeerPct||"—")+'%</div>';
        }

      html+='</div>';

function loadFeed(){
  onValue(ref(db,"posts"),function(snap){
    var container=document.getElementById("feed-container");if(!container)return;
    var posts=[];
    if(snap.exists())snap.forEach(function(p){posts.push({id:p.key,...p.val()});});
    posts.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    if(!posts.length){container.innerHTML='<div class="empty"><div class="ei">&#128247;</div><p>Nothing shared yet. Be the first!</p></div>';return;}
    var html="";
    posts.forEach(function(post){html+=buildPostHTML(post);});
    container.innerHTML=html;
  });
}

function rubricSummaryLabel(vals){
  if(!vals)return null;
  var done=vals.filter(function(v){return v!==null&&v!==undefined;}).length;
  if(!done)return null;
  return done+"/7 areas reflected";
}

function buildPostHTML(post){
  var comments=post.comments?Object.values(post.comments):[];
  var html='<div class="post" id="post-'+post.id+'">';
  html+='<div class="post-hdr">';
  if(post.photo)html+='<img src="'+esc(post.photo)+'" class="post-av" onclick="viewProf(\''+esc(post.uid)+'\')">';
  else html+='<div class="post-avp" onclick="viewProf(\''+esc(post.uid)+'\')">'+esc((post.name||"?")[0])+'</div>';
  html+='<div style="flex:1"><div class="post-name" onclick="viewProf(\''+esc(post.uid)+'\')">'+esc(post.name||"Student")+'</div>';
  html+='<div class="post-meta">'+esc(post.productType||"")+" &bull; "+formatDateTime(post.createdAt||Date.now())+" ("+timeAgo(post.createdAt||Date.now())+")"+'</div></div>';
  if(post.isDraft)html+='<span class="post-draft">Draft</span>';
  html+='</div>';
  html+='<div class="post-body">';
  if(post.title)html+='<div style="font-size:14px;font-weight:700;margin-bottom:5px">'+esc(post.title)+'</div>';
  if(post.link)html+='<a href="'+esc(post.link)+'" target="_blank" class="obtn mb8" style="display:inline-block">View work &#8599;</a>';
  var summ=rubricSummaryLabel(post.selfRubric);
  if(summ)html+='<div style="font-size:11px;color:var(--pd);background:var(--pl);display:inline-block;padding:3px 9px;border-radius:20px;margin-bottom:6px">'+summ+'</div>';
  if(post.well)html+='<div class="post-text"><strong>Did well:</strong> '+esc(post.well)+'</div>';
  if(post.improve)html+='<div class="post-text"><strong>To improve:</strong> '+esc(post.improve)+'</div>';
  html+='</div>';
  if(comments.length){
    html+='<div class="comments-section">';
    comments.slice(-3).forEach(function(cm){
      html+='<div class="comment"><div class="comment-name">'+esc(cm.from||"Student")+'</div>';
      html+='<div class="comment-text">'+esc(cm.text||"")+'</div></div>';
    });
    if(comments.length>3)html+='<div style="font-size:11px;color:var(--th);padding:4px 0">'+( comments.length-3)+' more comments</div>';
    html+='</div>';
  }
  html+='<div class="post-actions">';
  if(post.uid!==CU.uid)html+='<button class="post-act" onclick="openComment(\''+post.id+'\')">&#128172; Comment +&#127881;</button>';
  if(post.link)html+='<button class="post-act" onclick="window.open(\''+esc(post.link)+'\',\'_blank\')">&#128279; View</button>';
  if(post.uid===CU.uid)html+='<button class="post-act" onclick="deletePost(\''+post.id+'\')">&#128465; Delete</button>';
  html+='</div>';
  html+='<div id="cmform-'+post.id+'" style="display:none;padding:10px 13px;border-top:1px solid var(--gb)">';
  html+='<div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--tm)">Leave feedback:</div>';

  html+='<textarea class="fta mb8" id="cm-text-'+post.id+'" placeholder="Add your comment..." style="min-height:52px"></textarea>';
  html+='<button class="btn btg" style="font-size:12px;padding:7px 14px" onclick="submitComment(\''+post.id+'\',\''+esc(post.uid)+'\')">Submit Comment</button>';
  html+='</div>';
  html+='</div>';
  return html;
}

// ── GENERIC RUBRIC SELECTOR (used for self-reflection, peer comments, teacher evaluation) ──
window._rubricStores={};
var TIER_LABELS=["Novice (1)","Developing (2)","Advanced (3)"];
function renderRubricBlock(containerId,rubric,values,storeKey){
  var el=document.getElementById(containerId);if(!el)return;
  var store=window._rubricStores[storeKey];
  if(!store.expanded)store.expanded={};
  var html="";
  rubric.forEach(function(item,ai){
    var isOpen=!!store.expanded[ai];
    html+='<div class="rubarea2">';
    html+='<div class="rubarea2-hdr"><div><div class="rubarea-name">'+esc(item.area)+'</div><div class="rubarea-q">'+esc(item.q)+'</div></div>';
    html+='<button type="button" class="rub-details-btn" onclick="toggleRubDetails(\''+storeKey+'\','+ai+')">Details '+(isOpen?"&#9650;":"&#9660;")+'</button></div>';
    html+='<div class="rub-pills">';
    item.levels.forEach(function(lvl,li){
      var sel=values[ai]===li;
      html+='<span class="rub-pill tier'+li+(sel?" sel":"")+'" onclick="pickRubricLevel(\''+storeKey+'\','+ai+','+li+')">'+TIER_LABELS[li]+'</span>';
    });
    html+='</div>';
    if(isOpen){
      html+='<div class="rub-details-panel">';
      item.levels.forEach(function(lvl,li){
        var sel=values[ai]===li;
        html+='<div class="rub-detail-item'+(sel?" sel":"")+'" onclick="pickRubricLevel(\''+storeKey+'\','+ai+','+li+')">';
        html+='<span class="rub-pill tier'+li+(sel?" sel":"")+'" style="margin-bottom:6px">'+TIER_LABELS[li]+'</span>';
        html+='<div class="rub-detail-title">'+esc(lvl.label)+'</div>';
        html+='<div class="rublevel-bullets">';
        lvl.bullets.forEach(function(b){html+='&#8226; '+esc(b)+'<br>';});
        html+='</div></div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  el.innerHTML=html;
}
window.pickRubricLevel=function(storeKey,ai,li){
  var s=window._rubricStores[storeKey];if(!s)return;
  s.values[ai]=li;
  renderRubricBlock(s.containerId,s.rubric,s.values,storeKey);
};
window.toggleRubDetails=function(storeKey,ai){
  var s=window._rubricStores[storeKey];if(!s)return;
  if(!s.expanded)s.expanded={};
  s.expanded[ai]=!s.expanded[ai];
  renderRubricBlock(s.containerId,s.rubric,s.values,storeKey);
};

var qState={i:0,platforms:[],productId:null,weakness:null,catalog:null};

async function startQuiz(){
  var c=contractData;
  if(c&&c.productType&&c.editUnlocked===false){toast("Ask your teacher to unlock editing first.");return;}
  qState={i:0,platforms:[],productId:null,weakness:null,catalog:null};
  setNav("home");
  document.getElementById("mc").innerHTML='<div class="loading">Loading...</div>';
  try{
    await ensureCatalogSeeded();
    qState.catalog=await loadCatalog();
    renderQuizStep();
  }catch(e){
    console.error("startQuiz failed:",e);
    document.getElementById("mc").innerHTML='<button class="btn bts mb8" onclick="go(\'home\')">&#8592; Back to Home</button>'
      +'<div class="card" style="border-color:var(--c);border-width:1.5px"><div style="font-size:14px;font-weight:700;margin-bottom:6px">Something went wrong loading the quiz</div>'
      +'<div style="font-size:13px;color:var(--tm);margin-bottom:10px">'+esc(e&&e.message?e.message:"Unknown error")+'</div>'
      +'<button class="btn btp btf" onclick="startQuiz()">Try again</button></div>';
  }
}
window.startQuiz=startQuiz;
window.qGoto=function(step){qState.i=step;renderQuizStep();};

function renderQuizStep(){
  var mc=document.getElementById("mc");
  if(qState.i===0)return renderQ1(mc);
  if(qState.i===1)return renderQ2(mc);
  if(qState.i===2)return renderQ3(mc);
  return showQuizResult(mc);
}

function quizTopBar(stepIdx){
  if(isLockedStep("step2"))return lockBarHTML();
  return '<button class="btn bts mb8" onclick="go(\'home\')">&#8592; Back to Home</button>'
    +'<div class="qprog"><div class="qpf" style="width:'+Math.round(stepIdx/3*100)+'%"></div></div>'
    +'<div class="ql">Question '+(stepIdx+1)+' of 3</div>';
}

function renderQ1(mc){
  var html=quizTopBar(0);
  html+='<div class="qq">What can you work with?</div><div class="qs2">Pick everything you have access to.</div>';
  html+='<div class="qopts">';
  PLATFORMS.forEach(function(pf){
    var on=qState.platforms.indexOf(pf)!==-1;
    html+='<div class="qo'+(on?" sel":"")+'" onclick="qToggle1(\''+esc(pf)+'\')">';
    html+='<span style="flex:1">'+pf+'</span><span class="qchk">'+(on?"&#10003;":"")+'</span></div>';
  });
  html+='</div><div class="qnav"><span></span>';
  html+='<button class="btn btp" '+(qState.platforms.length===0?"disabled":"")+' onclick="qGoto(1)">Continue &#8594;</button></div>';
  mc.innerHTML=html;
}
window.qToggle1=function(pf){
  var idx=qState.platforms.indexOf(pf);
  if(idx===-1)qState.platforms.push(pf);else qState.platforms.splice(idx,1);
  renderQ1(document.getElementById("mc"));
};

function renderQ2(mc){
  var html=quizTopBar(1);
  html+='<div class="qq">What kind of project do you want to make?</div><div class="qs2">Tap the one that sounds best.</div>';
  ["written","spoken","visual"].forEach(function(cat){
    var opts=qState.catalog[cat].filter(function(p){return p.active;});
    if(!opts.length)return;
    html+='<div style="font-size:11px;font-weight:700;color:var(--th);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px">'+CAT_EMOJI[cat]+' '+CAT_LABELS[cat]+'</div>';
    html+='<div class="qopts">';
    opts.forEach(function(p){
      var on=qState.productId===p.id;
      html+='<div class="qo'+(on?" sel":"")+'" onclick="qPick2(\''+p.id+'\')">';
      html+='<span style="flex:1">'+esc(p.name)+'</span><span class="qchk">'+(on?"&#10003;":"")+'</span></div>';
    });
    html+='</div>';
  });
  html+='<div class="qnav"><button class="btn bts" onclick="qGoto(0)">Back</button>';
  html+='<button class="btn btp" '+(!qState.productId?"disabled":"")+' onclick="qGoto(2)">Continue &#8594;</button></div>';
  mc.innerHTML=html;
}
window.qPick2=function(id){qState.productId=id;renderQ2(document.getElementById("mc"));};

function renderQ3(mc){
  var html=quizTopBar(2);
  html+='<div class="qq">What feels hardest for you right now?</div><div class="qs2">Be honest — we\'ll give you a few tips for this.</div>';
  html+='<div class="qopts">';
  WEAKNESS_OPTS.forEach(function(o){
    var on=qState.weakness===o.value;
    html+='<div class="qo'+(on?" sel":"")+'" onclick="qPick3(\''+o.value+'\')">';
    html+='<span style="font-size:16px;width:24px;flex-shrink:0">'+o.e+'</span><span style="flex:1">'+o.t+'</span><span class="qchk">'+(on?"&#10003;":"")+'</span></div>';
  });
  html+='</div><div class="qnav"><button class="btn bts" onclick="qGoto(1)">Back</button>';
  html+='<button class="btn btp" '+(!qState.weakness?"disabled":"")+' onclick="qGoto(3)">See my idea &#8594;</button></div>';
  mc.innerHTML=html;
}
window.qPick3=function(v){qState.weakness=v;renderQ3(document.getElementById("mc"));};

function showQuizResult(mc){
  var rec=productById(qState.catalog,qState.productId);
  var cat=catOfProduct(qState.catalog,qState.productId);
  var alternates=qState.catalog[cat].filter(function(p){return p.active&&p.id!==rec.id;}).slice(0,3);
  var whyText="You chose "+CAT_LABELS[cat].toLowerCase()+(qState.platforms.length?" using "+qState.platforms.join(", ")+".":".");

  var html=isLockedStep("step2")?lockBarHTML():'<button class="btn bts mb8" onclick="go(\'home\')">&#8592; Back</button>';

  html+='<div class="card" style="border-color:var(--p);border-width:1.5px;text-align:center;padding:20px">';
  html+='<div style="font-size:17px;font-weight:700;margin-bottom:6px">'+esc(rec.name)+'</div>';
  html+='<div style="font-size:12px;color:var(--tm);margin-bottom:14px">'+whyText+'</div>';
  html+='<button class="btn btg btf" onclick="chooseProduct(\''+rec.id+'\',\''+esc(rec.name)+'\',\''+cat+'\')">Choose this idea &#8594;</button>';
  html+='</div>';
  if(alternates.length){
    html+='<div class="card"><div style="font-size:12px;font-weight:700;color:var(--th);margin-bottom:8px">Other ideas in this style</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    alternates.forEach(function(p){
      html+='<div style="padding:6px 12px;border:1px solid var(--gb);border-radius:20px;font-size:12px;cursor:pointer" onclick="chooseProduct(\''+esc(p.id)+'\',\''+esc(p.name)+'\',\''+cat+'\')">'+esc(p.name)+'</div>';

  }

    var tips=SKILL_TIPS[qState.weakness]||[];

async function renderTSession(){
  var mc=document.getElementById("mc");
  var snap=await get(ref(db,"liveSession"));
  var s=snap.exists()?snap.val():{active:false};
  var html='<div class="pt">Run Class</div><div class="ps">Take control of every student\'s screen for this part of the lesson.</div>';

  html+='<div class="card" style="text-align:center;padding:18px;border-color:'+(s.active?"var(--t)":"var(--gb)")+';border-width:1.5px">';
  if(!s.active){html+='<div style="font-size:14px;font-weight:700;color:var(--tm)">&#128275; No session live — students are browsing freely</div>';}
  else if(s.step==="step1"){html+='<div style="font-size:14px;font-weight:700;color:var(--td)">&#128214; Showing "What We\'re Learning" to everyone</div>';}
  else{
    var rem=Math.max(0,Math.round((s.deadline-Date.now())/1000));
    var label=s.step==="step2"?"Get Ideas timer running":"Project Plan timer running";
    html+='<div style="font-size:14px;font-weight:700;color:var(--td)">&#9203; '+label+'</div>';
    html+='<div style="font-size:28px;font-weight:800;margin-top:6px" id="tsession-timer">'+Math.floor(rem/60)+":"+(rem%60<10?"0":"")+(rem%60)+'</div>';
  }
  html+='</div>';

  html+='<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:8px">Step 1 — What We\'re Learning</div>';
  html+='<button class="btn btp btf" onclick="startSessionStep1()">&#128214; Show to whole class now</button></div>';

  html+='<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:8px">Step 2 — Get Ideas (timed)</div>';
  html+='<div class="fg"><label class="fl">Minutes</label><input class="fi" type="number" id="session-minutes-2" value="10" min="1" style="max-width:100px"></div>';
  html+='<button class="btn btp btf" onclick="startSessionStep2()">&#9654; Start timer for whole class</button>';
  if(s.active&&s.step==="step2"){
    html+='<div style="display:flex;gap:8px;margin-top:8px">';
    html+='<button class="btn bts" style="flex:1" onclick="adjustSessionTime(-2)">&#8722;2 min</button>';
    html+='<button class="btn bts" style="flex:1" onclick="adjustSessionTime(2)">+2 min</button>';
    html+='</div>';
  }
  html+='</div>';

  html+='<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:2px">Step 3 — Project Plan (timed)</div>';
  html+='<div style="font-size:11px;color:var(--tm);margin-bottom:8px">Starting this also unlocks Step 3 for every grouped student.</div>';
  html+='<div class="fg"><label class="fl">Minutes</label><input class="fi" type="number" id="session-minutes-3" value="15" min="1" style="max-width:100px"></div>';
  html+='<button class="btn btp btf" onclick="startSessionStep3()">&#9654; Start Project Plan for whole class</button>';
  if(s.active&&s.step==="step3"){
    html+='<div style="display:flex;gap:8px;margin-top:8px">';
    html+='<button class="btn bts" style="flex:1" onclick="adjustSessionTime(-2)">&#8722;2 min</button>';
    html+='<button class="btn bts" style="flex:1" onclick="adjustSessionTime(2)">+2 min</button>';
    html+='</div>';
  }
  html+='</div>';

  if(s.active)html+='<button class="btn btf" style="background:var(--c);color:#fff" onclick="endSession()">&#9209; End Session — back to free browsing</button>';
  mc.innerHTML=html;

  if(s.active&&(s.step==="step2"||s.step==="step3")){
    clearInterval(window._tsessionInterval);
    window._tsessionInterval=setInterval(async function(){
      var snap2=await get(ref(db,"liveSession"));
      if(!snap2.exists()||!snap2.val().active){clearInterval(window._tsessionInterval);return;}
      var s2=snap2.val();var rem2=Math.max(0,Math.round((s2.deadline-Date.now())/1000));
      var el=document.getElementById("tsession-timer");
      if(el)el.textContent=Math.floor(rem2/60)+":"+(rem2%60<10?"0":"")+(rem2%60);
    },1000);
  } else {
    clearInterval(window._tsessionInterval);
  }
}
window.startSessionStep1=async function(){
  await set(ref(db,"liveSession"),{active:true,step:"step1",deadline:null,updatedAt:Date.now()});
  toast("Now showing 'What We're Learning' to the whole class");
  renderTSession();
};
window.startSessionStep2=async function(){
  var mins=parseInt((document.getElementById("session-minutes-2")||{}).value)||10;
  await set(ref(db,"liveSession"),{active:true,step:"step2",deadline:Date.now()+mins*60000,updatedAt:Date.now()});
  toast("Timer started for the whole class!");
  renderTSession();
};
window.startSessionStep3=async function(){
  var mins=parseInt((document.getElementById("session-minutes-3")||{}).value)||15;
  // unlock Step 3 for every student who is currently waiting on grouping
  var snap=await get(ref(db,"contracts"));
  if(snap.exists()){
    var updates={};
    snap.forEach(function(c){if(c.val().status==="awaiting_grouping")updates[c.key+"/status"]="draft";});
    if(Object.keys(updates).length)await update(ref(db,"contracts"),updates);
  }
  await set(ref(db,"liveSession"),{active:true,step:"step3",deadline:Date.now()+mins*60000,updatedAt:Date.now()});
  toast("Project Plan started — Step 3 is now unlocked for the class!");
  renderTSession();
};
window.adjustSessionTime=async function(delta){
  var snap=await get(ref(db,"liveSession"));if(!snap.exists())return;
  var s=snap.val();
  await update(ref(db,"liveSession"),{deadline:(s.deadline||Date.now())+delta*60000,updatedAt:Date.now()});
  renderTSession();
};
window.endSession=async function(){
  await set(ref(db,"liveSession"),{active:false,step:null,deadline:null,updatedAt:Date.now()});
  toast("Session ended — students are back to free browsing");
  renderTSession();
};

window.saveAssign=async function(){
  var selEl=document.getElementById("asgn-sel");var selId=selEl?selEl.value:"";
  var selName=selEl&&selEl.options[selEl.selectedIndex]?selEl.options[selEl.selectedIndex].text:"";
  if(!selId){toast("Select a group!");return;}
  var checked=Array.from(document.querySelectorAll("#asgn-students input:checked"));
  if(!checked.length){toast("Select students!");return;}
  var members={};
  for(var i=0;i<checked.length;i++){
    var cb=checked[i];members[cb.dataset.uid]=cb.dataset.name;
    await update(ref(db,"users/"+cb.dataset.uid),{groupId:selId,groupName:selName});
  }
  await update(ref(db,"groups/"+selId),{members:members});
  toast("Assigned!");loadGroups();
};

    if(!snap.exists()){ef.innerHTML='<div class="empty"><div class="ei">&#128247;</div><p>No posts yet.</p></div>';return;}
    var posts=[];snap.forEach(function(p){posts.push({id:p.key,...p.val()});});
    posts.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    var html="";
    posts.forEach(function(post){
      var comments=post.comments?Object.values(post.comments):[];
      html+='<div class="post" style="margin-bottom:10px"><div class="post-hdr">';
      if(post.photo)html+='<img src="'+esc(post.photo)+'" class="post-av">';
      else html+='<div class="post-avp">'+esc((post.name||"?")[0])+'</div>';
      html+='<div><div class="post-name">'+esc(post.name||"Student")+'</div>';
      html+='<div class="post-meta">'+esc(post.productType||"")+" &bull; "+formatDateTime(post.createdAt||Date.now())+'</div></div></div>';
      html+='<div class="post-body">';
      if(post.title)html+='<div style="font-size:14px;font-weight:700;margin-bottom:4px">'+esc(post.title)+'</div>';
      if(post.link)html+='<a href="'+esc(post.link)+'" target="_blank" class="obtn mb8" style="display:inline-block">View work &#8599;</a>';
      if(comments.length){
        html+='<div style="font-size:12px;font-weight:700;color:var(--tm);margin-top:6px;margin-bottom:5px">'+comments.length+' comment(s)</div>';
      }
      html+='</div>';
      html+='<div class="post-actions">';
      html+='<button class="post-act" onclick="openTeacherComment(\''+post.id+'\',\''+esc(post.uid)+'\')">&#128105;&#8205;&#127979; Add Evaluation</button>';
      html+='</div>';
      html+='<div id="tcform-'+post.id+'" style="display:none;padding:10px 13px;border-top:1px solid var(--gb)">';
      html+='<div id="tc-rub-'+post.id+'"></div>';
      html+='<textarea class="fta mt8 mb8" id="tc-text-'+post.id+'" placeholder="Your feedback for this student..."></textarea>';
      html+='<button class="btn btg" style="font-size:12px;padding:7px 13px" onclick="submitTeacherComment(\''+post.id+'\',\''+esc(post.uid)+'\')">Save Evaluation</button>';
      html+='</div></div>';
    });
    ef.innerHTML=html;
  });
}

window.openTeacherComment=function(postId,targetUid){
  var form=document.getElementById("tcform-"+postId);if(!form)return;
  if(form.style.display!=="none"){form.style.display="none";return;}
  form.style.display="block";
  var storeKey="tceval_"+postId;
  window._rubricStores[storeKey]={values:new Array(PEER_RUBRIC.length).fill(null),rubric:PEER_RUBRIC,containerId:"tc-rub-"+postId};
  renderRubricBlock("tc-rub-"+postId,PEER_RUBRIC,window._rubricStores[storeKey].values,storeKey);
};

window.submitTeacherComment=async function(postId,targetUid){
  var text=((document.getElementById("tc-text-"+postId)||{}).value||"").trim();
  if(!text){toast("Write your feedback!");return;}
  var storeKey="tceval_"+postId;
  await push(ref(db,"posts/"+postId+"/comments"),{from:CU.displayName+" (Teacher)",fromId:CU.uid,text:text,peerRubric:window._rubricStores[storeKey]?window._rubricStores[storeKey].values:[],isTeacher:true,createdAt:Date.now()});
  if(targetUid){await push(ref(db,"notifications/"+targetUid),{type:"teacher",message:"Your teacher left feedback on your work!",read:false,createdAt:Date.now()});}
  toast("Evaluation saved!");var f=document.getElementById("tcform-"+postId);if(f)f.style.display="none";
};

function renderTUnit(){
  var mc=document.getElementById("mc");
  mc.innerHTML='<div class="pt">Unit Info</div><div class="ps">This is Step 1 on the student Home page.</div><div class="loading">Loading...</div>';
  get(ref(db,"unitInfo")).then(function(snap){
    var info=snap.exists()?snap.val():{title:"",description:"",theme:"",grammarTips:"",unitWords:"",imageUrl:"",targetGrammar:""};
    window._unitImageUrl=info.imageUrl||"";
    var html='<div class="card">';
    html+='<div class="fg"><label class="fl">Unit Title</label><input class="fi" id="unit-title" value="'+esc(info.title||"")+'" placeholder="e.g. Our Community"></div>';
    html+='<div class="fg"><label class="fl">Theme</label><input class="fi" id="unit-theme" value="'+esc(info.theme||"")+'" placeholder="e.g. Identity & Belonging"></div>';
    html+='<div class="fg"><label class="fl">Description (shown to students)</label><textarea class="fta" id="unit-desc" style="min-height:80px" placeholder="What will students explore in this unit?">'+esc(info.description||"")+'</textarea></div>';
    html+='<div class="fg"><label class="fl">Image</label><input type="file" accept="image/*" class="fi" id="unit-image-file" onchange="uploadUnitImage(this)">';
    html+='<div id="unit-image-preview" style="margin-top:8px">'+(info.imageUrl?'<img src="'+esc(info.imageUrl)+'" style="width:100%;border-radius:8px;display:block">':"")+'</div></div>';
    html+='<div class="fg"><label class="fl">Grammar Tips (one per line)</label><textarea class="fta" id="unit-grammar" style="min-height:80px" placeholder="e.g. Use past simple for finished actions&#10;Remember -ed for regular verbs">'+esc(info.grammarTips||"")+'</textarea></div>';
    html+='<div class="fg"><label class="fl">Unit Words (comma or line separated)</label><textarea class="fta" id="unit-words" style="min-height:60px" placeholder="e.g. ancestor, tradition, generation">'+esc(info.unitWords||"")+'</textarea></div>';
    html+='<div class="fg"><label class="fl">Target Grammar (used in the contract goal)</label><input class="fi" id="unit-target-grammar" value="'+esc(info.targetGrammar||"")+'" placeholder="e.g. past simple tense"></div>';
    html+='<button class="btn btp btf" onclick="saveUnit()">Save Unit Info</button></div>';
    mc.innerHTML='<div class="pt">Unit Info</div><div class="ps">This is Step 1 on the student Home page.</div>'+html;
  });
}

window.uploadUnitImage=async function(input){
  var file=input.files[0];if(!file)return;
  var prev=document.getElementById("unit-image-preview");
  if(prev)prev.innerHTML='<div class="loading" style="padding:10px">Uploading...</div>';
  try{
    var path="unitImages/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9.]/g,"_");
    var fileRef=sref(storage,path);
    await uploadBytes(fileRef,file);
    var url=await getDownloadURL(fileRef);
    window._unitImageUrl=url;
    if(prev)prev.innerHTML='<img src="'+url+'" style="width:100%;border-radius:8px;display:block">';
    toast("Image uploaded!");
  }catch(e){
    toast("Upload failed — check your connection and try again.");
    if(prev)prev.innerHTML="";
  }
};

window.saveUnit=async function(){
  var title=((document.getElementById("unit-title")||{}).value||"").trim();
  var theme=((document.getElementById("unit-theme")||{}).value||"").trim();
  var desc=((document.getElementById("unit-desc")||{}).value||"").trim();
  var imageUrl=window._unitImageUrl||"";
  var grammarTips=((document.getElementById("unit-grammar")||{}).value||"").trim();
  var unitWords=((document.getElementById("unit-words")||{}).value||"").trim();
  var targetGrammar=((document.getElementById("unit-target-grammar")||{}).value||"").trim();
  await set(ref(db,"unitInfo"),{title:title,theme:theme,description:desc,imageUrl:imageUrl,grammarTips:grammarTips,unitWords:unitWords,targetGrammar:targetGrammar,updatedAt:Date.now()});
  toast("Unit info saved! Students can now see it.");
};
</script>
